<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auralis — Music Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07130F;
  --bg-2:#0A1A14;
  --panel:#0E2019;
  --panel-2:#12281F;
  --line:#1E3B2C;
  --line-soft:rgba(201,162,39,0.22);
  --gold:#C9A227;
  --gold-bright:#E8C766;
  --emerald:#17B978;
  --emerald-deep:#0F9D68;
  --text:#F3EFE1;
  --muted:#7FA396;
  --muted-2:#527562;
  --danger:#E1685C;
  --radius-sm:10px;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top left, rgba(23,185,120,0.10), transparent 45%),
    radial-gradient(ellipse at bottom right, rgba(201,162,39,0.08), transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:'Manrope', sans-serif;
  overflow:hidden;
}
::selection{background:var(--gold); color:#07130F;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2);}

.serif{font-family:'Fraunces', serif;}
.mono{font-family:'JetBrains Mono', monospace;}

/* ============ APP SHELL ============ */
.shell{
  display:grid;
  grid-template-columns:240px 1fr;
  grid-template-rows:1fr auto;
  height:100vh;
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
}

/* ===== Sidebar ===== */
.sidebar{
  grid-row:1/2;
  background:linear-gradient(180deg, var(--panel), var(--bg-2));
  border-right:1px solid var(--line);
  padding:26px 18px;
  display:flex;
  flex-direction:column;
}
.wordmark{
  font-family:'Fraunces', serif;
  font-size:23px;
  font-weight:600;
  letter-spacing:0.3px;
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:6px;
  color:var(--text);
}
.wordmark .dot{
  width:9px;height:9px;
  border-radius:50%;
  background:var(--gold-bright);
  box-shadow:0 0 10px rgba(232,199,102,0.7);
}
.tagline{
  font-size:11px;
  color:var(--muted-2);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:0 0 30px 18px;
}
.nav{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  color:var(--muted);
  font-weight:600;
  font-size:13.5px;
  transition:background .15s, color .15s;
  position:relative;
}
.nav-item svg{width:17px;height:17px; flex-shrink:0;}
.nav-item:hover{background:var(--panel-2); color:var(--text);}
.nav-item.active{color:var(--gold-bright); background:rgba(201,162,39,0.10);}
.nav-item.active::before{
  content:"";
  position:absolute; left:-18px; top:50%; transform:translateY(-50%);
  width:3px; height:18px;
  background:var(--gold-bright);
  border-radius:0 3px 3px 0;
}
.nav-count{margin-left:auto; font-size:11px; color:var(--muted-2); font-family:'JetBrains Mono',monospace;}

.sidebar-divider{
  height:1px;
  background:var(--line);
  margin:22px 0;
}
.sidebar-note{
  margin-top:auto;
  font-size:11px;
  color:var(--muted-2);
  line-height:1.6;
  padding:14px;
  border:1px solid var(--line-soft);
  border-radius:var(--radius-sm);
}
.sidebar-note b{color:var(--gold);}

/* ===== Main ===== */
.main{
  grid-row:1/2;
  overflow-y:auto;
  padding:26px 34px 130px;
}
.main-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:26px;
  flex-wrap:wrap;
}
.view-title{
  font-family:'Fraunces', serif;
  font-size:28px;
  font-weight:600;
  margin:0;
}
.view-sub{color:var(--muted); font-size:13px; margin-top:4px;}

.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 16px;
  min-width:260px;
}
.search-box svg{width:15px;height:15px; color:var(--muted-2); flex-shrink:0;}
.search-box input{
  background:none; border:none; outline:none;
  color:var(--text); font-family:'Manrope',sans-serif; font-size:13.5px;
  width:100%;
}
.search-box input::placeholder{color:var(--muted-2);}

/* Track ledger list */
.ledger-head{
  display:grid;
  grid-template-columns:44px 1fr 140px 70px 40px;
  gap:14px;
  padding:0 14px 10px;
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted-2);
  font-weight:700;
}
@media (max-width:640px){
  .ledger-head{grid-template-columns:32px 1fr 40px;}
  .col-artist, .col-time{display:none;}
}

.track-row{
  display:grid;
  grid-template-columns:44px 1fr 140px 70px 40px;
  align-items:center;
  gap:14px;
  padding:11px 14px;
  border-bottom:1px solid rgba(30,59,44,0.5);
  cursor:pointer;
  border-radius:8px;
  transition:background .12s;
  position:relative;
}
@media (max-width:640px){
  .track-row{grid-template-columns:32px 1fr 40px;}
  .col-artist, .col-time{display:none;}
}
.track-row:hover{background:var(--panel-2);}
.track-row.playing{background:rgba(23,185,120,0.08);}
.col-num{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:var(--gold);
  display:flex; align-items:center; justify-content:center;
  width:28px; height:28px;
  border:1px solid var(--line-soft);
  border-radius:6px;
}
.track-row.playing .col-num{border-color:var(--emerald); color:var(--emerald);}
.col-main{display:flex; align-items:center; gap:12px; min-width:0;}
.mini-art{
  width:38px;height:38px;
  border-radius:7px;
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:14px;
  color:rgba(255,255,255,0.9);
}
.col-title{min-width:0;}
.t-title{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);}
.track-row.playing .t-title{color:var(--emerald);}
.t-artist-inline{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.col-artist{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.col-time{font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted-2); text-align:right;}
.col-fav{display:flex; justify-content:center;}
.fav-icon-btn{background:none; border:none; cursor:pointer; color:var(--muted-2); padding:4px; display:flex;}
.fav-icon-btn:hover{color:var(--gold-bright);}
.fav-icon-btn.active{color:var(--danger);}
.fav-icon-btn svg{width:16px;height:16px;}

.eq{display:flex; gap:2px; align-items:flex-end; height:12px;}
.eq span{width:2px; background:var(--emerald); animation:eqbar 0.9s ease-in-out infinite;}
.eq span:nth-child(2){animation-delay:.2s;}
.eq span:nth-child(3){animation-delay:.4s;}
@keyframes eqbar{0%,100%{height:3px;}50%{height:11px;}}

.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--muted-2);
}
.empty-state svg{width:44px;height:44px; margin-bottom:14px; opacity:.6;}
.empty-state p{font-size:13.5px; margin:0;}

/* ============ PERSISTENT PLAYER BAR ============ */
.player-bar{
  grid-column:1/3;
  grid-row:2/3;
  background:linear-gradient(180deg, var(--panel), #0A1911);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:280px 1fr 280px;
  align-items:center;
  gap:20px;
  padding:12px 22px;
  z-index:20;
}
@media (max-width:860px){
  .player-bar{grid-template-columns:1fr auto; padding:10px 14px;}
  .pb-right{display:none;}
}

.pb-left{display:flex; align-items:center; gap:12px; min-width:0; cursor:pointer;}
.pb-art{
  width:50px;height:50px;
  border-radius:9px;
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif; font-weight:600; font-size:18px;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);
}
.pb-info{min-width:0;}
.pb-title{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pb-artist{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pb-fav{background:none; border:none; color:var(--muted-2); cursor:pointer; padding:4px; flex-shrink:0;}
.pb-fav svg{width:16px;height:16px;}
.pb-fav.active{color:var(--danger);}

.pb-center{display:flex; flex-direction:column; align-items:center; gap:6px; max-width:640px; margin:0 auto; width:100%;}
.pb-controls{display:flex; align-items:center; gap:16px;}
.ctrl-btn{
  background:none; border:none; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  padding:6px; border-radius:50%;
  transition:color .15s, transform .15s;
}
.ctrl-btn:hover{color:var(--text); transform:translateY(-1px);}
.ctrl-btn.active{color:var(--emerald);}
.ctrl-btn svg{width:17px;height:17px;}
.play-btn{
  width:38px;height:38px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--gold), var(--gold-bright));
  color:#0A1911;
}
.play-btn:hover{color:#0A1911; box-shadow:0 0 0 4px rgba(232,199,102,0.15);}
.play-btn svg{width:16px;height:16px;}

.pb-progress{display:flex; align-items:center; gap:8px; width:100%;}
.time-label{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted-2); width:34px;}
.time-label.right{text-align:right;}
input[type=range]{
  -webkit-appearance:none; appearance:none;
  height:4px; border-radius:4px;
  background:var(--line);
  outline:none; flex:1;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;height:12px; border-radius:50%;
  background:var(--gold-bright);
  box-shadow:0 0 0 4px rgba(232,199,102,0.18);
  cursor:pointer;
}
#seek{background:linear-gradient(to right, var(--emerald) 0%, var(--gold) var(--pct,0%), var(--line) var(--pct,0%));}

.pb-right{display:flex; align-items:center; justify-content:flex-end; gap:14px;}
#volume{max-width:100px;}
#volume::-webkit-slider-thumb{background:var(--emerald); box-shadow:0 0 0 4px rgba(23,185,120,0.18);}
#volume{background:linear-gradient(to right, var(--emerald) 0%, var(--emerald) var(--vpct,70%), var(--line) var(--vpct,70%));}

/* ============ NOW PLAYING FULLSCREEN ============ */
.now-playing{
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(23,185,120,0.16), transparent 50%),
    radial-gradient(ellipse at 85% 90%, rgba(201,162,39,0.14), transparent 55%),
    #06110D;
  z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 24px;
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
}
.now-playing.open{opacity:1; pointer-events:all;}
.np-close{
  position:absolute; top:26px; right:30px;
  background:none; border:none; color:var(--muted); cursor:pointer;
  padding:8px;
}
.np-close svg{width:22px;height:22px;}
.np-close:hover{color:var(--text);}
.np-vinyl-wrap{position:relative; width:300px; height:300px; margin-bottom:34px;}
.np-vinyl{
  width:100%;height:100%; border-radius:50%;
  background:repeating-radial-gradient(circle at center, #0A1109 0px,#0A1109 2px,#101a14 3px,#101a14 4px);
  box-shadow:0 24px 50px rgba(0,0,0,0.5), inset 0 0 0 2px #030805;
  display:flex; align-items:center; justify-content:center;
  animation:spin 10s linear infinite; animation-play-state:paused;
}
.np-vinyl.playing{animation-play-state:running;}
.np-label{
  width:110px;height:110px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif; font-weight:600; font-size:30px;
  box-shadow:0 0 0 3px #06110D, 0 0 0 4px var(--line);
}
@keyframes spin{to{transform:rotate(360deg);}}
.np-title{font-family:'Fraunces', serif; font-size:26px; font-weight:600; text-align:center;}
.np-artist{color:var(--muted); font-size:14px; margin-top:4px; margin-bottom:26px;}
.np-progress{width:100%; max-width:420px; display:flex; align-items:center; gap:10px;}
.np-controls{display:flex; align-items:center; gap:26px; margin-top:22px;}
.np-controls .ctrl-btn svg{width:22px;height:22px;}
.np-controls .play-btn{width:56px;height:56px;}
.np-controls .play-btn svg{width:24px;height:24px;}

/* Toast */
.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--panel-2); border:1px solid var(--line-soft);
  color:var(--text); font-size:13px; padding:10px 18px; border-radius:999px;
  opacity:0; transition:opacity .25s, transform .25s;
  pointer-events:none; z-index:200;
  display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast svg{width:14px;height:14px; color:var(--gold-bright);}

audio{display:none;}
</style>
</head>
<body>

<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="wordmark"><span class="dot"></span>Auralis</div>
    <div class="tagline">Music Library</div>

    <ul class="nav">
      <li class="nav-item active" data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Library <span class="nav-count" id="countLibrary">0</span>
      </li>
      <li class="nav-item" data-view="favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
        Favorites <span class="nav-count" id="countFav">0</span>
      </li>
      <li class="nav-item" data-view="queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h13M3 12h13M3 18h7"/><path d="M18 9l3 3-3 3"/></svg>
        Queue <span class="nav-count" id="countQueue">0</span>
      </li>
      <li class="nav-item" data-view="recent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Recently Played
      </li>
    </ul>

    <div class="sidebar-divider"></div>

  </aside>

  <!-- MAIN -->
  <main class="main" id="mainPanel">
    <div class="main-header">
      <div>
        <h1 class="view-title serif" id="viewTitle">Library</h1>
        <div class="view-sub" id="viewSub">All tracks</div>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search title or artist…">
      </div>
    </div>

    <div class="ledger-head">
      <div>No.</div>
      <div>Title</div>
      <div class="col-artist">Artist</div>
      <div class="col-time">Actions</div>
      <div></div>
    </div>
    <div id="trackContainer"></div>
  </main>

  <!-- PLAYER BAR -->
  <div class="player-bar">
    <div class="pb-left" id="pbOpenNow">
      <div class="pb-art" id="pbArt">♪</div>
      <div class="pb-info">
        <div class="pb-title" id="pbTitle">Select a track</div>
        <div class="pb-artist" id="pbArtist">—</div>
      </div>
    </div>

    <div class="pb-center">
      <div class="pb-controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>
      <div class="pb-progress">
        <span class="time-label mono" id="curTime">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
        <span class="time-label mono right" id="durTime">0:00</span>
      </div>
    </div>

    <div class="pb-right">
      <button class="pb-fav" id="pbFav" title="Favorite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
      </button>
      <button class="ctrl-btn" id="muteBtn" style="padding:4px;">
        <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor" width="17" height="17"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>
      </button>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>
  </div>
</div>

<!-- FULLSCREEN NOW PLAYING -->
<div class="now-playing" id="nowPlaying">
  <button class="np-close" id="npClose">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="np-vinyl-wrap">
    <div class="np-vinyl" id="npVinyl">
      <div class="np-label" id="npLabel">♪</div>
    </div>
  </div>
  <div class="np-title serif" id="npTitle">Select a track</div>
  <div class="np-artist" id="npArtist">—</div>
  <div class="np-progress">
    <span class="time-label mono" id="npCur">0:00</span>
    <input type="range" id="npSeek" min="0" max="100" value="0" step="0.1">
    <span class="time-label mono right" id="npDur">0:00</span>
  </div>
  <div class="np-controls">
    <button class="ctrl-btn" id="npShuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
    <button class="ctrl-btn" id="npPrev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>

/* ============ STATE ============ */
let current = 0;
let isPlaying = false;
let isShuffle = false;
let repeatMode = 0; // 0 off, 1 all, 2 one
let currentView = "library";
let searchTerm = "";
let favorites = JSON.parse(localStorage.getItem("verdant_favs") || "[]");
let queue = JSON.parse(localStorage.getItem("verdant_queue") || "[]");
let recent = JSON.parse(localStorage.getItem("verdant_recent") || "[]");

/* ============ ELEMENTS ============ */
const audio = document.getElementById("audio");
const trackContainer = document.getElementById("trackContainer");
const viewTitle = document.getElementById("viewTitle");
const viewSub = document.getElementById("viewSub");
const searchInput = document.getElementById("searchInput");
const navItems = document.querySelectorAll(".nav-item");

const pbArt = document.getElementById("pbArt");
const pbTitle = document.getElementById("pbTitle");
const pbArtist = document.getElementById("pbArtist");
const pbFav = document.getElementById("pbFav");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const repeatBtn = document.getElementById("repeatBtn");
const seek = document.getElementById("seek");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const volume = document.getElementById("volume");
const muteBtn = document.getElementById("muteBtn");
const volIcon = document.getElementById("volIcon");

const nowPlaying = document.getElementById("nowPlaying");
const npVinyl = document.getElementById("npVinyl");
const npLabel = document.getElementById("npLabel");
const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const npSeek = document.getElementById("npSeek");
const npCur = document.getElementById("npCur");
const npDur = document.getElementById("npDur");
const npPlay = document.getElementById("npPlay");
const npPlayIcon = document.getElementById("npPlayIcon");
const npShuffle = document.getElementById("npShuffle");
const npRepeat = document.getElementById("npRepeat");

const toast = document.getElementById("toast");
const toastText = document.getElementById("toastText");

/* ============ HELPERS ============ */
function fmt(t){
  if(isNaN(t)||t===undefined) return "0:00";
  const m=Math.floor(t/60), s=Math.floor(t%60);
  return `${m}:${s.toString().padStart(2,"0")}`;
}
function isFav(id){ return favorites.includes(id); }
function saveFavs(){ localStorage.setItem("verdant_favs", JSON.stringify(favorites)); }
function saveQueue(){ localStorage.setItem("verdant_queue", JSON.stringify(queue)); }
function saveRecent(){ localStorage.setItem("verdant_recent", JSON.stringify(recent)); }

function toggleFav(id){
  favorites = isFav(id) ? favorites.filter(x=>x!==id) : [...favorites, id];
  saveFavs();
  showToast(isFav(id) ? "Added to Favorites" : "Removed from Favorites");
  renderView();
  updatePlayerBar();
}
function addToQueue(id){
  if(!queue.includes(id)){
    queue.push(id);
    saveQueue();
    showToast("Added to Queue");
    if(currentView==="queue") renderView();
    updateCounts();
  } else {
    showToast("Already in Queue");
  }
}
function removeFromQueue(id){
  queue = queue.filter(x=>x!==id);
  saveQueue();
  renderView();
  updateCounts();
}
function showToast(msg){
  toastText.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove("show"), 1600);
}
function updateCounts(){
  document.getElementById("countLibrary").textContent = TRACKS.length;
  document.getElementById("countFav").textContent = favorites.length;
  document.getElementById("countQueue").textContent = queue.length;
}

/* ============ VIEW RENDERING ============ */
const VIEW_META = {
  library:{title:"Library", sub:"All tracks in your collection"},
  favorites:{title:"Favorites", sub:"Songs you've loved"},
  queue:{title:"Queue", sub:"Up next"},
  recent:{title:"Recently Played", sub:"Your listening history"}
};

function getViewTracks(){
  let ids;
  if(currentView==="library") ids = TRACKS.map(t=>t.id);
  else if(currentView==="favorites") ids = favorites;
  else if(currentView==="queue") ids = queue;
  else if(currentView==="recent") ids = recent;
  let list = ids.map(id=>TRACKS.find(t=>t.id===id)).filter(Boolean);
  if(searchTerm){
    const s = searchTerm.toLowerCase();
    list = list.filter(t=>t.title.toLowerCase().includes(s) || t.artist.toLowerCase().includes(s));
  }
  return list;
}

function renderView(){
  const meta = VIEW_META[currentView];
  viewTitle.textContent = meta.title;
  viewSub.textContent = meta.sub;
  const list = getViewTracks();
  updateCounts();

  if(list.length===0){
    trackContainer.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <p>${currentView==="favorites" ? "No favorites yet — tap the heart on any track." : currentView==="queue" ? "Queue is empty — add tracks from the library." : currentView==="recent" ? "Nothing played yet." : "No tracks match your search."}</p>
      </div>`;
    return;
  }

  trackContainer.innerHTML = "";
  list.forEach((t, idx)=>{
    const row = document.createElement("div");
    row.className = "track-row" + (t.id===current+1 && current!==null && TRACKS[current] && TRACKS[current].id===t.id ? " playing" : "");
    const isCurrent = TRACKS[current] && TRACKS[current].id===t.id;
    if(isCurrent) row.classList.add("playing");
    row.innerHTML = `
      <div class="col-num">${isCurrent && isPlaying ? '<div class="eq"><span></span><span></span><span></span></div>' : String(idx+1).padStart(2,"0")}</div>
      <div class="col-main">
        <div class="mini-art" style="background:${t.color}">${t.title[0]}</div>
        <div class="col-title">
          <div class="t-title">${t.title}</div>
          <div class="t-artist-inline">${t.artist}</div>
        </div>
      </div>
      <div class="col-artist">${t.artist}</div>
      <div class="col-time">
        <button class="fav-icon-btn" data-qadd="${t.id}" title="Add to Queue" style="margin-right:4px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="col-fav">
        <button class="fav-icon-btn ${isFav(t.id)?'active':''}" data-fav="${t.id}">
          <svg viewBox="0 0 24 24" fill="${isFav(t.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
        </button>
      </div>
    `;
    row.addEventListener("click", (e)=>{
      if(e.target.closest("[data-fav]") || e.target.closest("[data-qadd]")) return;
      const globalIdx = TRACKS.findIndex(x=>x.id===t.id);
      loadTrack(globalIdx);
      playAudio();
    });
    row.querySelector("[data-fav]").addEventListener("click",(e)=>{
      e.stopPropagation();
      toggleFav(t.id);
    });
    row.querySelector("[data-qadd]").addEventListener("click",(e)=>{
      e.stopPropagation();
      if(currentView==="queue") removeFromQueue(t.id);
      else addToQueue(t.id);
    });
    if(currentView==="queue"){
      row.querySelector("[data-qadd] svg").innerHTML = `<path d="M6 6l12 12M18 6L6 18"/>`;
      row.querySelector("[data-qadd]").title = "Remove from Queue";
    }
    trackContainer.appendChild(row);
  });
}

navItems.forEach(item=>{
  item.addEventListener("click", ()=>{
    navItems.forEach(n=>n.classList.remove("active"));
    item.classList.add("active");
    currentView = item.dataset.view;
    searchInput.value = "";
    searchTerm = "";
    renderView();
  });
});
searchInput.addEventListener("input", ()=>{
  searchTerm = searchInput.value.trim();
  renderView();
});

/* ============ PLAYER LOGIC ============ */
function loadTrack(i){
  current = i;
  const t = TRACKS[i];
  audio.src = t.src;
  pbTitle.textContent = t.title;
  pbArtist.textContent = t.artist;
  pbArt.style.background = t.color;
  pbArt.textContent = t.title[0];
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  npLabel.style.background = t.color;
  npLabel.textContent = t.title[0];
  updatePlayerBar();

  recent = [t.id, ...recent.filter(id=>id!==t.id)].slice(0, 20);
  saveRecent();
  if(currentView==="recent") renderView();
}
function updatePlayerBar(){
  const t = TRACKS[current];
  if(!t) return;
  pbFav.classList.toggle("active", isFav(t.id));
}
function playAudio(){
  audio.play();
  isPlaying = true;
  npVinyl.classList.add("playing");
  playIcon.innerHTML = `<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>`;
  npPlayIcon.innerHTML = playIcon.innerHTML;
  renderView();
}
function pauseAudio(){
  audio.pause();
  isPlaying = false;
  npVinyl.classList.remove("playing");
  playIcon.innerHTML = `<path d="M8 5v14l11-7z"></path>`;
  npPlayIcon.innerHTML = playIcon.innerHTML;
  renderView();
}
function togglePlay(){ isPlaying ? pauseAudio() : playAudio(); }

function nextTrack(auto=false){
  if(isShuffle){
    let n;
    do{ n = Math.floor(Math.random()*TRACKS.length); }while(n===current && TRACKS.length>1);
    loadTrack(n);
  } else {
    let n = current+1;
    if(n>=TRACKS.length){
      if(repeatMode===1) n=0;
      else if(auto){ pauseAudio(); return; }
      else n=0;
    }
    loadTrack(n);
  }
  playAudio();
}
function prevTrack(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  let n = current-1 < 0 ? TRACKS.length-1 : current-1;
  loadTrack(n);
  playAudio();
}

playBtn.addEventListener("click", togglePlay);
npPlay.addEventListener("click", togglePlay);
nextBtn.addEventListener("click", ()=>nextTrack(false));
npNext.addEventListener("click", ()=>nextTrack(false));
prevBtn.addEventListener("click", prevTrack);
npPrev.addEventListener("click", prevTrack);

function toggleShuffle(){
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle("active", isShuffle);
  npShuffle.classList.toggle("active", isShuffle);
}
shuffleBtn.addEventListener("click", toggleShuffle);
npShuffle.addEventListener("click", toggleShuffle);

function cycleRepeat(){
  repeatMode = (repeatMode+1)%3;
  [repeatBtn, npRepeat].forEach(b=>{
    b.classList.toggle("active", repeatMode>0);
    b.style.opacity = repeatMode===2 ? "0.55" : "1";
  });
}
repeatBtn.addEventListener("click", cycleRepeat);
npRepeat.addEventListener("click", cycleRepeat);

pbFav.addEventListener("click", ()=>{ if(TRACKS[current]) toggleFav(TRACKS[current].id); });

audio.addEventListener("timeupdate", ()=>{
  if(!isNaN(audio.duration)){
    const pct = (audio.currentTime/audio.duration)*100;
    seek.value = pct; seek.style.setProperty("--pct", pct+"%");
    npSeek.value = pct; npSeek.style.setProperty("--pct", pct+"%");
    curTime.textContent = fmt(audio.currentTime);
    npCur.textContent = fmt(audio.currentTime);
  }
});
audio.addEventListener("loadedmetadata", ()=>{
  durTime.textContent = fmt(audio.duration);
  npDur.textContent = fmt(audio.duration);
});
audio.addEventListener("ended", ()=>{
  if(repeatMode===2){ audio.currentTime=0; playAudio(); }
  else { nextTrack(true); }
});
function onSeek(el){
  if(audio.duration) audio.currentTime = (el.value/100)*audio.duration;
}
seek.addEventListener("input", ()=>onSeek(seek));
npSeek.addEventListener("input", ()=>onSeek(npSeek));

volume.addEventListener("input", ()=>{
  audio.volume = volume.value/100;
  volume.style.setProperty("--vpct", volume.value+"%");
  updateVolIcon();
});
muteBtn.addEventListener("click", ()=>{
  audio.muted = !audio.muted;
  updateVolIcon();
});
function updateVolIcon(){
  const muted = audio.muted || audio.volume===0;
  volIcon.innerHTML = muted
    ? `<path d="M3 10v4h4l5 5V5L7 10H3z"/><line x1="16" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2"/><line x1="21" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2"/>`
    : `<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/>`;
}

/* Now Playing fullscreen */
document.getElementById("pbOpenNow").addEventListener("click", ()=>{
  if(TRACKS[current]) nowPlaying.classList.add("open");
});
document.getElementById("npClose").addEventListener("click", ()=>{
  nowPlaying.classList.remove("open");
});

/* Keyboard shortcuts */
document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
  if(e.code==="ArrowRight") nextTrack(false);
  if(e.code==="ArrowLeft") prevTrack();
  if(e.code==="Escape") nowPlaying.classList.remove("open");
});

/* ============ INIT ============ */
audio.volume = 0.7;
loadTrack(0);
renderView();
updateCounts();
</script>
